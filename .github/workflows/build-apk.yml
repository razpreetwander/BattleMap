name: Build BattleMaps Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build APK with Gradle
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} output/BattleMaps.apk \;
          ls -la output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BattleMaps-Android-APK
          path: output/BattleMaps.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "BattleMaps v1.0.0 - Playable Android APK"
          body: |
            ## 🎮 BattleMaps Android APK (Ready to Play!)
            
            **Rebranded & Optimized by X Supreme**
            
            ### ✨ Features:
            - **Smooth 60FPS Territory Capture Engine**: Expand your land by creating loops.
            - **Touch / Virtual Joystick**: Silky-smooth steering on all mobile devices.
            - **8 Intelligent AI Bots**: Dynamic archetypes (hunters, expanders, defenders).
            - **Instant Kills**: Slice enemy trails to eliminate them and steal their territory.
            - **Minimap & Live Leaderboard**: Real-time stats and conquered percentage.
            - **Audio & Haptic Feedback**: Procedural sound effects and vibration.
            
            ### 📲 Installation:
            Download **`BattleMaps.apk`** below, tap to install, and enjoy playing!
          files: output/BattleMaps.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
