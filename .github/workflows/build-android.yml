name: Build BattleMaps Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  buildAndroid:
    name: Build Android APK
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:ubuntu-6000.0.23f1-android-3.2.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Activate Unity and Build Android APK
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          echo "Starting Unity headless build with online login..."
          unity-editor \
            -batchmode \
            -nographics \
            -username "$UNITY_EMAIL" \
            -password "$UNITY_PASSWORD" \
            -projectPath . \
            -executeMethod BattleMaps.EditorTools.BattleMapsBuildScript.BuildAndroid \
            -logFile /dev/stdout \
            -quit

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: BattleMaps-Android-APK
          path: build/Android/
